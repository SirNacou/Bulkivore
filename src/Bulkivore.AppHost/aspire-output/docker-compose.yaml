services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "bulkivore.apphost-4c590507c3-postgres-data"
        read_only: false
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__bulkivore-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=bulkivore-db"
      BULKIVORE_DB_HOST: "postgres"
      BULKIVORE_DB_PORT: "5432"
      BULKIVORE_DB_USERNAME: "postgres"
      BULKIVORE_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      BULKIVORE_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bulkivore-db"
      BULKIVORE_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/bulkivore-db"
      BULKIVORE_DB_DATABASENAME: "bulkivore-db"
      ConnectionStrings__bulkivore-test-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=bulkivore-test-db"
      BULKIVORE_TEST_DB_HOST: "postgres"
      BULKIVORE_TEST_DB_PORT: "5432"
      BULKIVORE_TEST_DB_USERNAME: "postgres"
      BULKIVORE_TEST_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      BULKIVORE_TEST_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bulkivore-test-db"
      BULKIVORE_TEST_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/bulkivore-test-db"
      BULKIVORE_TEST_DB_DATABASENAME: "bulkivore-test-db"
      TEST_DB_CONN: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bulkivore-test-db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    expose:
      - "${API_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  bulkivore.apphost-4c590507c3-postgres-data:
    driver: "local"
